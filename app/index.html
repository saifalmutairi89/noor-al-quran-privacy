<!DOCTYPE html>
<html lang="ar">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/noor-al-quran-privacy/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Noor Al-Quran: learn, recite and memorize the Quran.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="نور القرآن">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <meta name="theme-color" content="#0E5A4E">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>نور القرآن · Noor Al-Quran</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preload" href="main.dart.js" as="script">
</head>
<body style="margin:0;background:#07352E">
  <!-- Shown at once while the app downloads, in the app's colours. -->
  <style>
    #loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
      background:linear-gradient(#24423B,#07352E);font:600 22px -apple-system,"Segoe UI",Tahoma,sans-serif;color:#E9D3A0}
    #loading img{width:96px;height:96px;border-radius:22px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
    #loading i{width:34px;height:34px;border-radius:50%;border:3px solid rgba(233,211,160,.25);border-top-color:#C9A04E;
      animation:spin 0.9s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
  <div id="loading"><img src="icons/Icon-192.png" alt=""><div>نور القرآن</div><i></i></div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>window.addEventListener("flutter-first-frame", () => document.getElementById("loading")?.remove());</script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
